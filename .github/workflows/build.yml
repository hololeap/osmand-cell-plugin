name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # GitHub's Ubuntu runners ship an Android SDK with its licenses accepted;
      # the Android Gradle Plugin downloads any missing platform or build-tools.
      - name: Test and build
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cell-coverage-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
